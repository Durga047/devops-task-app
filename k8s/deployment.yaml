apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-task-app
  template:
    metadata:
      labels:
        app: devops-task-app
    spec:
      containers:
        - name: devops-task-app
          image: devops-task-app:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
